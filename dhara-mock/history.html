<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="side"></aside>
<main class="main">
  <div class="mockbar">মক প্রদর্শনী: এখানে দেখানো আইন, ধারা, তারিখ ও লেখা কাল্পনিক উদাহরণ, প্রকৃত আইন নয়।
    <a class="tourbtn" href="index.html?tour=1" style="text-decoration:none">ডেমো আবার শুরু করুন</a></div>
  <section class="hist">
    <h1>অনুসন্ধানের ইতিহাস</h1>
    <p class="lede">আগের প্রশ্নগুলো, যে তারিখের আইনে খোঁজা হয়েছিল এবং কী ফল এসেছিল। যেকোনো প্রশ্ন আবার চালাতে চাপ দিন।</p>
    <div class="hhead"><span>প্রশ্ন</span><span>আইনের তারিখ</span><span>ফলাফল</span><span></span></div>
    <div id="list"></div>
  </section>
</main>
<script src="data.js"></script>
<script>
  sidebar('hist');
  const RES = { ok: ['valid', 'উদ্ধৃতি সহ উত্তর'], time: ['mid', 'পুরোনো সংস্করণে উত্তর'], warn: ['warn', 'সতর্কতা সহ উত্তর'], no: ['no', 'উত্তর দেওয়া হয়নি'] };
  document.getElementById('list').innerHTML = EXAMPLES.map((e, i) => `
    <a class="hrow" href="index.html?ex=${i}">
      <span><span class="hq">${e.q}</span><br><span class="hd">${e.label}</span></span>
      <span class="hd">${fmt(e.d)}</span>
      <span><span class="b ${RES[e.kind][0]}">${RES[e.kind][1]}</span></span>
      <span class="open">আবার চালান</span>
    </a>`).join('');
</script>
